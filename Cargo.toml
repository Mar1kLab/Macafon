[workspace]
members = [
    "crates/macafon-dsp",
    "crates/macafon-soundpad",
    "crates/macafon-studio",
    "crates/macafon-engine",
    "crates/macafon-config",
    "crates/macafon-apps",
    "crates/macafon-ipc",
    "crates/macafon-backend",
    "crates/macafon-backend-pipewire",
    "crates/macafon-backend-windows",
    "apps/macafond",
    "apps/macafon-cli",
    "apps/macafon-ui/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
tracing = "0.1"
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
macafon-dsp = { path = "crates/macafon-dsp" }
macafon-soundpad = { path = "crates/macafon-soundpad" }
macafon-engine = { path = "crates/macafon-engine" }
macafon-config = { path = "crates/macafon-config" }
macafon-apps = { path = "crates/macafon-apps" }
macafon-ipc = { path = "crates/macafon-ipc" }
macafon-backend = { path = "crates/macafon-backend" }
macafon-backend-windows = { path = "crates/macafon-backend-windows" }
macafon-backend-pipewire = { path = "crates/macafon-backend-pipewire" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# tract 0.21.5 codegen reuses convolution bias node names in DFN3. Its debug-only
# compaction name assertion rejects the otherwise valid graph; production omits it.
# Keep our audio code's assertions enabled and match production only for this dependency.
[profile.dev.package.tract-core]
debug-assertions = false

[profile.test.package.tract-core]
debug-assertions = false

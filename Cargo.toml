[workspace]
members = [
    "crates/macafon-dsp",
    "crates/macafon-engine",
    "crates/macafon-config",
    "crates/macafon-ipc",
    "crates/macafon-backend-pipewire",
    "apps/macafond",
    "apps/macafon-cli",
    "apps/macafon-ui/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
tracing = "0.1"
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
macafon-dsp = { path = "crates/macafon-dsp" }
macafon-engine = { path = "crates/macafon-engine" }
macafon-config = { path = "crates/macafon-config" }
macafon-ipc = { path = "crates/macafon-ipc" }
macafon-backend-pipewire = { path = "crates/macafon-backend-pipewire" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

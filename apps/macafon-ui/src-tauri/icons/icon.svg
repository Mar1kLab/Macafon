<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <title>Macafon Retro microphone in an amber speech cloud</title>
  <!-- Launcher artwork: the owner-approved rounded tile and palette are independent of UI surfaces. -->
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="0.25" y2="1">
      <stop stop-color="#303135"/><stop offset="0.32" stop-color="#1a1b1e"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0.3" y2="1">
      <stop stop-color="#f2f1ee" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#f2f1ee" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f2f1ee" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ffc14d"/><stop offset="0.5" stop-color="#f2a516"/>
      <stop offset="1" stop-color="#e8573f"/>
    </linearGradient>
    <linearGradient id="metal" x2="0.2" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f1ee"/>
    </linearGradient>
  </defs>
  <path id="tile" d="M39 4H89C113 4 124 15 124 39V89C124 113 113 124 89 124H39C15 124 4 113 4 89V39C4 15 15 4 39 4Z" fill="url(#surface)" stroke="url(#rim)" stroke-width="0.8"/>
  <path id="cloud-shape" d="M31 99C19 99 11 91 11 79C11 69 17 61 26 58C21 43 30 29 45 29C53 14 75 14 84 29C100 27 112 40 109 56C120 62 122 77 115 88C111 95 103 99 94 99H85L94 112L67 99Z" fill="url(#cloud)"/>
  <g id="microphone" transform="translate(30.4 18) scale(0.7)" stroke-linecap="round" stroke-linejoin="round">
    <path id="yoke-outline" d="M17 49V66C17 83 30 93 48 93C66 93 79 83 79 66V49" fill="none" stroke="#121316" stroke-width="10"/>
    <path id="yoke" d="M17 49V66C17 83 30 93 48 93C66 93 79 83 79 66V49" fill="none" stroke="url(#metal)" stroke-width="5.5"/>
    <path id="housing" d="M25 32C25 18 33 10 48 10C63 10 71 18 71 32V62C71 78 62 84 48 84C34 84 25 78 25 62Z" fill="url(#metal)" stroke="#121316" stroke-width="3.5"/>
    <path id="grille" d="M35 25C43 22 53 22 61 25M34 35C43 32 53 32 62 35M34 45C43 42 53 42 62 45M35 55C43 52 53 52 61 55M37 65C43 67 53 67 59 65" fill="none" stroke="#121316" stroke-width="4"/>
    <g id="screws" stroke="#121316" stroke-width="3" fill="url(#metal)">
      <circle cx="17" cy="49" r="4"/><circle cx="79" cy="49" r="4"/>
    </g>
    <path id="stem-outline" d="M48 94V106" stroke="#121316" stroke-width="10"/>
    <path id="stem" d="M48 94V106" stroke="#ffffff" stroke-width="5.5"/>
    <path id="foot" d="M32 112C32 108 37 106 48 106C59 106 64 108 64 112C64 114 32 114 32 112Z" fill="url(#metal)" stroke="#121316" stroke-width="3.5"/>
  </g>
</svg>

[package]
name = "macafond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
macafon-apps.workspace = true
macafon-config.workspace = true
macafon-dsp.workspace = true
macafon-engine.workspace = true
macafon-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
macafon-backend.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
assert_no_alloc = { version = "1.1.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
global-hotkey = "0.8"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
macafon-backend-pipewire.workspace = true
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
macafon-backend-windows.workspace = true

[lints]
workspace = true

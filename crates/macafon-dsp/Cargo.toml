[package]
name = "macafon-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
# 0.5.2 switched to thread-local lazy FFT allocation, unsuitable for a fresh RT thread.
nnnoiseless = { version = "=0.5.1", default-features = false }
serde = { workspace = true, optional = true }
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]
# TypeScript declarations for the UI (macafon-ipc `ts` feature).
ts = ["serde", "dep:ts-rs"]

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false }
criterion = { version = "0.7", default-features = false }
serde_json.workspace = true
toml.workspace = true

[[bench]]
name = "microphone"
harness = false

[lints]
workspace = true

[package]
name = "macafon-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
macafon-dsp = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl"] }

[target.'cfg(windows)'.dependencies]
interprocess = "2.4"
widestring = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_IO",
] }

[dev-dependencies]
macafon-config.workspace = true

[features]
# Generates apps/macafon-ui/src/lib/ipc/*.ts: `MACAFON_UPDATE_TS=1 cargo test -p macafon-ipc --features ts`.
ts = ["dep:ts-rs", "macafon-dsp/ts"]

[lints]
workspace = true

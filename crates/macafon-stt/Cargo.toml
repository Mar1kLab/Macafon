[package]
name = "macafon-stt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
whisper = ["dep:whisper-rs"]
parakeet = ["dep:sherpa-onnx"]
# Whisper on the GPU through ggml's Vulkan backend (STT-020); needs the Vulkan SDK to build.
vulkan = ["whisper", "whisper-rs/vulkan"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
whisper-rs = { version = "0.15.1", optional = true }
sherpa-onnx = { version = "1.13.8", optional = true, default-features = false, features = ["shared"] }

[dev-dependencies]
hound = "3.5"

[lints]
workspace = true

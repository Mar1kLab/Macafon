[package]
name = "miceq-dsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# 0.5.2 switched to thread-local lazy FFT allocation, unsuitable for a fresh RT thread.
nnnoiseless = { version = "=0.5.1", default-features = false }
serde = { workspace = true, optional = true }
thiserror.workspace = true

[features]
serde = ["dep:serde"]

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", default-features = false }
criterion = { version = "0.7", default-features = false }
serde_json.workspace = true
toml.workspace = true

[[bench]]
name = "microphone"
harness = false

[lints]
workspace = true
